buildscript {
    dependencies {
        classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.4.10")
    }
}

plugins {
    id('com.android.application')
    id("org.jetbrains.kotlin.android")
    id('com.google.gms.google-services')
    id('com.google.firebase.crashlytics')
    id("org.jetbrains.kotlin.plugin.compose") version "2.2.0" // this version matches your Kotlin version
}

android {
    compileSdk 36
    namespace = "dk.hug.treehugger"
    defaultConfig {
        applicationId "dk.hug.treehugger"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 18
        versionName "1.6.2"
    }
    buildFeatures {
        compose = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.14"
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2026.06.01")
    implementation(composeBom)
    androidTestImplementation(composeBom)

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.22.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.3")
    implementation("androidx.activity:activity-compose:1.13.0")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material3:material3:1.3.2")
    implementation("androidx.compose.material:material-icons-core:1.7.8") // added manually because it was removed from BOM 025.09.01 and higher
    implementation("androidx.navigation:navigation-compose:2.9.8")
    implementation("com.google.maps.android:android-maps-utils:3.8.0")
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation("com.google.maps.android:maps-compose:4.2.0")
    implementation 'com.google.maps.android:maps-compose-utils:4.2.0'
    implementation("com.airbnb.android:lottie-compose:6.4.1")


    testImplementation 'junit:junit:4.13.2'
}
